<!DOCTYPE html>

<html lang="de"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Alte Herren – FC Pontos München</title><style>:root{--gold:#ffc21a}*{box-sizing:border-box}body{margin:0;background:#101114;color:white;font:16px/1.6 system-ui,Arial,sans-serif}header{padding:18px max(22px,calc((100vw - 1100px)/2));background:#1b1c20;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:15px}header img{width:55px;height:65px;object-fit:contain}a{color:var(--gold);text-decoration:none}main{max-width:1100px;margin:auto;padding:42px 22px 80px}h1{color:var(--gold);font-size:clamp(32px,5vw,54px);margin:18px 0 8px}.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:32px}.photo{padding:0;background:#1b1c20;border:1px solid var(--gold);border-radius:12px;overflow:hidden;cursor:zoom-in;color:white;text-align:left}.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}dialog{max-width:95vw;max-height:95vh;background:#111;border:2px solid var(--gold);border-radius:12px;color:white}dialog::backdrop{background:#000d}dialog img{max-width:88vw;max-height:77vh;object-fit:contain;display:block}dialog button{float:right;background:var(--gold);border:0;border-radius:6px;padding:8px 12px;font-weight:bold;margin-bottom:10px;cursor:pointer}@media(max-width:700px){.photos{grid-template-columns:1fr}}</style><style id="pontos-social-style">.pontos-social{padding:34px 18px;text-align:center;background:#151619;border-top:1px solid #ffc21a55;color:#fff}.pontos-social h2{margin:0 0 7px;font-size:clamp(22px,3vw,30px);color:#ffc21a}.pontos-social p{margin:0 0 19px;color:#d6d6dc}.pontos-social-links{display:flex;justify-content:center;gap:15px;flex-wrap:wrap}.pontos-social-links a{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;background:#24252a;border:1px solid #ffc21a;border-radius:12px;color:#fff;text-decoration:none;font-weight:800;transition:background .2s,transform .2s}.pontos-social-links a:hover,.pontos-social-links a:focus-visible{background:#363027;transform:translateY(-2px)}.pontos-social-links svg{width:24px;height:24px;fill:#ffc21a}</style></head><body><header><img alt="FC Pontos Wappen" src="logo-fc-pontos.png"/><strong>FC PONTOS MÜNCHEN · 1968</strong></header><main><a href="galerie.html">← Zurück zur Galerie</a><h1>Alte Herren</h1><p>Fotoalbum unserer Alten Herren – drei Mannschaftsfotos.</p><div class="photos"><button aria-label="Mannschaftsfoto vergrößern" class="photo" data-image="alte-herren-1.jpg" type="button"><img alt="Mannschaftsfoto der Alten Herren" loading="lazy" src="alte-herren-1.jpg"/></button><button aria-label="Mannschaftsfoto vergrößern" class="photo" data-image="alte-herren-2.jpg" type="button"><img alt="Mannschaftsfoto der Alten Herren" loading="lazy" src="alte-herren-2.jpg"/></button><button aria-label="Mannschaftsfoto vergrößern" class="photo" data-image="alte-herren-3.jpg" type="button"><img alt="Mannschaftsfoto der Alten Herren" loading="lazy" src="alte-herren-3.jpg"/></button></div></main><dialog id="lightbox"><button id="close" type="button">✕ Schließen</button><img alt="Vergrößertes Mannschaftsfoto" id="large"/></dialog><script>const d=document.getElementById('lightbox');document.querySelectorAll('.photo').forEach(b=>b.addEventListener('click',()=>{document.getElementById('large').src=b.dataset.image;d.showModal()}));document.getElementById('close').onclick=()=>d.close();d.addEventListener('click',e=>{if(e.target===d)d.close()});</script><section aria-label="Social Media" class="pontos-social" id="social-media"><h2 data-de="Folgt FC Pontos München" data-el="Ακολουθήστε τον FC Pontos München">Folgt FC Pontos München</h2><p data-de="Aktuelles, Bilder und Neuigkeiten aus unserem Verein" data-el="Νέα, φωτογραφίες και ενημερώσεις από τον σύλλογό μας">Aktuelles, Bilder und Neuigkeiten aus unserem Verein</p><div class="pontos-social-links"><a aria-label="FC Pontos auf Facebook öffnen" href="https://www.facebook.com/fcpontos/?locale=el_GR" rel="noopener noreferrer" target="_blank"><svg aria-hidden="true" viewbox="0 0 24 24"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.2 2.23.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.77l-.44 2.89h-2.33v6.99A10 10 0 0 0 22 12z"></path></svg>Facebook</a><a aria-label="FC Pontos auf Instagram öffnen" href="https://www.instagram.com/fcpontos1968/" rel="noopener noreferrer" target="_blank"><svg aria-hidden="true" viewbox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.5-2.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"></path></svg>Instagram</a></div></section></body></html>
