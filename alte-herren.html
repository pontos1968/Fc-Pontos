<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>Alte Herren – FC Pontos München</title><style>:root{--gold:#ffc21a}*{box-sizing:border-box}body{margin:0;background:#101114;color:white;font:16px/1.6 system-ui,Arial,sans-serif}header{padding:18px max(22px,calc((100vw - 1100px)/2));background:#1b1c20;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:15px}header img{width:55px;height:65px;object-fit:contain}a{color:var(--gold);text-decoration:none}main{max-width:1100px;margin:auto;padding:42px 22px 80px}h1{color:var(--gold);font-size:clamp(32px,5vw,54px);margin:18px 0 8px}.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:32px}.photo{padding:0;background:#1b1c20;border:1px solid var(--gold);border-radius:12px;overflow:hidden;cursor:zoom-in;color:white;text-align:left}.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}dialog{max-width:95vw;max-height:95vh;background:#111;border:2px solid var(--gold);border-radius:12px;color:white}dialog::backdrop{background:#000d}dialog img{max-width:88vw;max-height:77vh;object-fit:contain;display:block}dialog button{float:right;background:var(--gold);border:0;border-radius:6px;padding:8px 12px;font-weight:bold;margin-bottom:10px;cursor:pointer}@media(max-width:700px){.photos{grid-template-columns:1fr}}</style></head><body><header><img alt="FC Pontos Wappen" src="logo-fc-pontos.png"/><strong>FC PONTOS MÜNCHEN · 1968</strong></header><main><a href="galerie.html">← Zurück zur Galerie</a><h1>Alte Herren</h1><p>Fotoalbum unserer Alten Herren – drei Mannschaftsfotos.</p><div class="photos"><button aria-label="Mannschaftsfoto vergrößern" class="photo" data-image="alte-herren-1.jpg" type="button"><img alt="Mannschaftsfoto der Alten Herren" loading="lazy" src="alte-herren-1.jpg"/></button><button aria-label="Mannschaftsfoto vergrößern" class="photo" data-image="alte-herren-2.jpg" type="button"><img alt="Mannschaftsfoto der Alten Herren" loading="lazy" src="alte-herren-2.jpg"/></button><button aria-label="Mannschaftsfoto vergrößern" class="photo" data-image="alte-herren-3.jpg" type="button"><img alt="Mannschaftsfoto der Alten Herren" loading="lazy" src="alte-herren-3.jpg"/></button></div></main><dialog id="lightbox"><button id="close" type="button">✕ Schließen</button><img alt="Vergrößertes Mannschaftsfoto" id="large"/></dialog><script>const d=document.getElementById('lightbox');document.querySelectorAll('.photo').forEach(b=>b.addEventListener('click',()=>{document.getElementById('large').src=b.dataset.image;d.showModal()}));document.getElementById('close').onclick=()=>d.close();d.addEventListener('click',e=>{if(e.target===d)d.close()});</script></body></html>
