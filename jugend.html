<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jugend | FC Pontos München</title><style>:root{--gold:#ffc21a}*{box-sizing:border-box}body{margin:0;background:#101114;color:white;font:16px/1.6 system-ui,Arial,sans-serif}a{color:inherit;text-decoration:none}header{border-top:7px solid var(--gold);border-bottom:1px solid #ffffff33;background:#191a1d}.nav{max-width:1160px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px;font-weight:900}.brand img{height:54px;max-width:50px;object-fit:contain}.lang{border:0;background:var(--gold);color:#111;border-radius:8px;padding:9px 15px;font-weight:900;cursor:pointer}.container{max-width:1160px;margin:auto;padding:48px 22px 80px}.back{display:inline-block;border:1px solid #ffffff80;border-radius:9px;padding:10px 16px;margin-bottom:24px}h1{font-size:clamp(32px,5vw,54px);margin:0 0 8px}h1 span{color:var(--gold)}p{color:#b6b6bd}.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:30px}.photo{padding:0;border:2px solid #c69c25;background:#1b1c20;border-radius:14px;overflow:hidden;cursor:zoom-in}.photo img{width:100%;height:auto;display:block;aspect-ratio:4/3;object-fit:contain}.photo:hover{border-color:var(--gold)}dialog{max-width:96vw;max-height:95vh;border:2px solid var(--gold);border-radius:12px;background:#111;color:white;padding:12px}dialog::backdrop{background:#000e}dialog img{display:block;max-width:90vw;max-height:80vh;object-fit:contain}dialog button{background:var(--gold);border:0;border-radius:7px;padding:9px 16px;margin-bottom:10px;cursor:pointer;font-weight:800}footer{text-align:center;border-top:1px solid #ffffff33;padding:24px;color:#b6b6bd}@media(max-width:650px){.photos{grid-template-columns:1fr}.nav{padding:12px 16px}}</style></head><body><header><div class="nav"><a class="brand" href="index.html"><img
